name: Deploy AWS Static Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "*.html"
      - "js/**"
      - "styles/**"
      - "assets/**"
      - "styles.css"
      - "404.html"
      - "robots.txt"
      - "sitemap.xml"
      - "favicon.ico"
      - "favicon.svg"
      - "artist/**"
      - "user/**"
      - "auth.html"
      - "account-settings.html"
      - "about.html"
      - "blog.html"
      - "contact.html"
      - "explore.html"
      - "faq.html"
      - "index.html"
      - "legal.html"
      - "unauthorized.html"
      - ".github/workflows/deploy-aws-static-site.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: ap-southeast-2
      STACK_NAME: artizans-stack

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Missing AWS deploy secrets."
            echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in GitHub repository secrets."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Resolve deployment targets from CloudFormation
        id: resolve
        run: |
          BUCKET="${{ secrets.ARTIZANS_BUCKET }}"
          DIST_ID="${{ secrets.ARTIZANS_DISTRIBUTION_ID }}"
          STACK="${{ secrets.AWS_STACK_NAME || env.STACK_NAME }}"

          if [ -z "$BUCKET" ] || [ -z "$DIST_ID" ]; then
            echo "Resolving deploy targets from stack: $STACK"
            BUCKET=$(aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue | [0]" \
              --output text)

            DIST_ID=$(aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue | [0]" \
              --output text)
          fi

          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "BucketName unresolved."
            echo "Set secret ARTIZANS_BUCKET or ensure stack output BucketName exists for stack $STACK."
            exit 1
          fi

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "CloudFrontDistributionId unresolved."
            echo "Set secret ARTIZANS_DISTRIBUTION_ID or ensure stack output CloudFrontDistributionId exists for stack $STACK."
            exit 1
          fi

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$DIST_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy to S3
        run: |
          aws s3 sync . "s3://${{ steps.resolve.outputs.bucket }}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".codex_state/*" \
            --exclude "output/*" \
            --exclude "aws/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.resolve.outputs.distribution_id }}" \
            --paths "/*"
