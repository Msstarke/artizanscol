name: Deploy AWS Static Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "*.html"
      - "js/**"
      - "styles/**"
      - "assets/**"
      - "styles.css"
      - "404.html"
      - "robots.txt"
      - "sitemap.xml"
      - "favicon.ico"
      - "favicon.svg"
      - "artist/**"
      - "user/**"
      - "auth.html"
      - "account-settings.html"
      - "about.html"
      - "blog.html"
      - "contact.html"
      - "explore.html"
      - "faq.html"
      - "index.html"
      - "legal.html"
      - "unauthorized.html"
      - ".github/workflows/deploy-aws-static-site.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      AWS_REGION: ap-southeast-2
      STACK_NAME: artizans-stack

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for backend deploy on same commit
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          api = f"https://api.github.com/repos/{repo}/actions/workflows/deploy-aws-backend.yml/runs?head_sha={sha}&event=push&per_page=1"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def fetch(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          data = fetch(api)
          runs = data.get("workflow_runs", [])
          if not runs:
              print("No backend workflow run found for this commit. Proceeding with static deploy.")
              sys.exit(0)

          run = runs[0]
          run_id = run["id"]
          run_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
          print(f"Waiting for backend workflow run {run_id} on commit {sha}.")

          for _ in range(60):
              status_data = fetch(run_url)
              status = status_data.get("status")
              conclusion = status_data.get("conclusion")
              print(f"Backend workflow status={status} conclusion={conclusion}")
              if status == "completed":
                  if conclusion == "success":
                      sys.exit(0)
                  print("Backend workflow did not succeed; aborting static deploy.", file=sys.stderr)
                  sys.exit(1)
              time.sleep(15)

          print("Timed out waiting for backend workflow to complete.", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Validate deploy secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Missing AWS deploy secrets."
            echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in GitHub repository secrets."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Resolve deployment targets from CloudFormation
        id: resolve
        run: |
          BUCKET="${{ secrets.ARTIZANS_BUCKET }}"
          DIST_ID="${{ secrets.ARTIZANS_DISTRIBUTION_ID }}"
          API_BASE_URL="${{ secrets.ARTIZANS_API_BASE_URL }}"
          STACK="${{ secrets.AWS_STACK_NAME || env.STACK_NAME }}"

          if [ -z "$BUCKET" ] || [ -z "$DIST_ID" ] || [ -z "$API_BASE_URL" ]; then
            echo "Resolving deploy targets from stack: $STACK"
            STACK_OUTPUTS=$(aws cloudformation describe-stacks \
              --stack-name "$STACK" \
              --query "Stacks[0].Outputs[*].[OutputKey,OutputValue]" \
              --output text)

            if [ -z "$BUCKET" ]; then
              BUCKET=$(printf '%s\n' "$STACK_OUTPUTS" | awk '$1=="BucketName" { print $2; exit }')
            fi

            if [ -z "$DIST_ID" ]; then
              DIST_ID=$(printf '%s\n' "$STACK_OUTPUTS" | awk '$1=="CloudFrontDistributionId" { print $2; exit }')
            fi

            if [ -z "$API_BASE_URL" ]; then
              API_BASE_URL=$(printf '%s\n' "$STACK_OUTPUTS" | awk '$1=="ApiCustomDomainUrl" { print $2; exit }')
            fi

            if [ -z "$API_BASE_URL" ]; then
              API_BASE_URL=$(printf '%s\n' "$STACK_OUTPUTS" | awk '$1=="ApiBaseUrl" { print $2; exit }')
            fi
          fi

          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "BucketName unresolved."
            echo "Set secret ARTIZANS_BUCKET or ensure stack output BucketName exists for stack $STACK."
            exit 1
          fi

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "CloudFrontDistributionId unresolved."
            echo "Set secret ARTIZANS_DISTRIBUTION_ID or ensure stack output CloudFrontDistributionId exists for stack $STACK."
            exit 1
          fi

          if [ "$API_BASE_URL" = "None" ]; then
            API_BASE_URL=""
          fi

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "api_base_url=$API_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Inject API base URL into frontend bundle
        if: ${{ steps.resolve.outputs.api_base_url != '' }}
        env:
          API_BASE_URL: ${{ steps.resolve.outputs.api_base_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          api_base_url = os.environ["API_BASE_URL"].rstrip("/")
          target = Path("js/api-client.js")
          source = target.read_text()
          replacement = f"const STATIC_API_BASE_URL = {json.dumps(api_base_url)};"

          if 'const STATIC_API_BASE_URL = "__ARTIZANS_API_BASE_URL__";' not in source:
            raise SystemExit("Could not find STATIC_API_BASE_URL placeholder in js/api-client.js")

          target.write_text(
              source.replace(
                  'const STATIC_API_BASE_URL = "__ARTIZANS_API_BASE_URL__";',
                  replacement,
                  1,
              )
          )
          print(f"Injected API base URL: {api_base_url}")
          PY

      - name: Deploy to S3
        run: |
          aws s3 sync . "s3://${{ steps.resolve.outputs.bucket }}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".codex_state/*" \
            --exclude "output/*" \
            --exclude "aws/*" \
            --exclude "backend/*" \
            --exclude "scripts/*" \
            --exclude "*.md" \
            --exclude "*.sh" \
            --exclude "*.json" \
            --exclude "*.lock" \
            --exclude "*.ai"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.resolve.outputs.distribution_id }}" \
            --paths "/*"
