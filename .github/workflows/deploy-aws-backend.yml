name: Deploy AWS Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "aws/cloudformation/artizans-aws-stack.yaml"
      - ".github/workflows/deploy-aws-backend.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "aws/cloudformation/artizans-aws-stack.yaml"
      - ".github/workflows/deploy-aws-backend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

jobs:
  ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Test backend
        working-directory: backend
        run: npm test

  deploy-dev:
    name: Deploy Backend (dev)
    needs: ci
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-backend-dev
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'ap-southeast-2' }}
      PROJECT_NAME: ${{ vars.AWS_PROJECT_NAME != '' && vars.AWS_PROJECT_NAME || 'artizans' }}
      STACK_NAME: ${{ secrets.AWS_STACK_NAME_DEV != '' && secrets.AWS_STACK_NAME_DEV || 'artizans-stack-dev' }}
      TARGET_ENV: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate deploy secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Missing AWS deploy secrets."
            echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in GitHub repository secrets."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve CloudFormation package bucket (dev)
        id: package_bucket_dev
        run: |
          PACKAGE_BUCKET="${{ secrets.AWS_CLOUDFORMATION_PACKAGE_BUCKET_DEV }}"
          if [ -z "$PACKAGE_BUCKET" ]; then
            PACKAGE_BUCKET="${{ secrets.ARTIZANS_BUCKET }}"
          fi

          if [ -z "$PACKAGE_BUCKET" ]; then
            PACKAGE_BUCKET=$(aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue | [0]" \
              --output text 2>/dev/null || true)
          fi

          if [ -z "$PACKAGE_BUCKET" ] || [ "$PACKAGE_BUCKET" = "None" ]; then
            echo "Could not resolve CloudFormation package bucket."
            echo "Set AWS_CLOUDFORMATION_PACKAGE_BUCKET_DEV or ARTIZANS_BUCKET, or ensure stack output BucketName exists."
            exit 1
          fi

          echo "package_bucket=$PACKAGE_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Deploy CloudFormation stack (dev)
        run: |
          aws cloudformation deploy \
            --stack-name "${STACK_NAME}" \
            --template-file aws/cloudformation/artizans-aws-stack.yaml \
            --s3-bucket "${{ steps.package_bucket_dev.outputs.package_bucket }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ProjectName="${PROJECT_NAME}" \
              EnvironmentName="${TARGET_ENV}" \
              EnableServerlessApi=true \
              EnableApiWaf=true

      - name: Dump CloudFormation failure events (dev)
        if: failure()
        run: |
          echo "### Recent failed CloudFormation events (${TARGET_ENV})" >> "$GITHUB_STEP_SUMMARY"
          aws cloudformation describe-stack-events \
            --stack-name "${STACK_NAME}" \
            --query "StackEvents[?contains(ResourceStatus, 'FAILED') || contains(ResourceStatus, 'ROLLBACK')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table | tee /tmp/cfn-events-dev.txt
          cat /tmp/cfn-events-dev.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Build Lambda package
        run: ./backend/scripts/build-lambda-package.sh

      - name: Deploy Lambda artifacts (dev)
        run: |
          ZIP_PATH="backend/.artifacts/artizans-backend-lambda.zip"
          OUTPUT_KEYS=(
            PublicApiFunctionName
            UserApiFunctionName
            ArtistApiFunctionName
            MessagingApiFunctionName
            AdminApiFunctionName
            PaymentsApiFunctionName
            WebhookApiFunctionName
          )

          echo "### Backend Lambda deploy (${TARGET_ENV})" >> "$GITHUB_STEP_SUMMARY"
          for key in "${OUTPUT_KEYS[@]}"; do
            function_name=$(aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query "Stacks[0].Outputs[?OutputKey=='${key}'].OutputValue | [0]" \
              --output text)

            if [ -z "${function_name}" ] || [ "${function_name}" = "None" ]; then
              echo "Missing CloudFormation output: ${key}" >&2
              exit 1
            fi

            version=$(aws lambda update-function-code \
              --function-name "${function_name}" \
              --zip-file "fileb://${ZIP_PATH}" \
              --publish \
              --query "Version" \
              --output text)

            aws lambda wait function-updated --function-name "${function_name}"
            echo "- ${function_name}: version ${version}" >> "$GITHUB_STEP_SUMMARY"
          done

  deploy-prod:
    name: Deploy Backend (prod)
    needs: ci
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-backend-prod
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'ap-southeast-2' }}
      PROJECT_NAME: ${{ vars.AWS_PROJECT_NAME != '' && vars.AWS_PROJECT_NAME || 'artizans' }}
      STACK_NAME: ${{ secrets.AWS_STACK_NAME_PROD != '' && secrets.AWS_STACK_NAME_PROD || 'artizans-stack' }}
      TARGET_ENV: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate deploy secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Missing AWS deploy secrets."
            echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in GitHub repository secrets."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve CloudFormation package bucket (prod)
        id: package_bucket_prod
        run: |
          PACKAGE_BUCKET="${{ secrets.AWS_CLOUDFORMATION_PACKAGE_BUCKET_PROD }}"
          if [ -z "$PACKAGE_BUCKET" ]; then
            PACKAGE_BUCKET="${{ secrets.ARTIZANS_BUCKET }}"
          fi

          if [ -z "$PACKAGE_BUCKET" ]; then
            PACKAGE_BUCKET=$(aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue | [0]" \
              --output text 2>/dev/null || true)
          fi

          if [ -z "$PACKAGE_BUCKET" ] || [ "$PACKAGE_BUCKET" = "None" ]; then
            echo "Could not resolve CloudFormation package bucket."
            echo "Set AWS_CLOUDFORMATION_PACKAGE_BUCKET_PROD or ARTIZANS_BUCKET, or ensure stack output BucketName exists."
            exit 1
          fi

          echo "package_bucket=$PACKAGE_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Deploy CloudFormation stack (prod)
        run: |
          aws cloudformation deploy \
            --stack-name "${STACK_NAME}" \
            --template-file aws/cloudformation/artizans-aws-stack.yaml \
            --s3-bucket "${{ steps.package_bucket_prod.outputs.package_bucket }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ProjectName="${PROJECT_NAME}" \
              EnvironmentName="${TARGET_ENV}" \
              EnableServerlessApi=true \
              EnableApiWaf=true

      - name: Dump CloudFormation failure events (prod)
        if: failure()
        run: |
          echo "### Recent failed CloudFormation events (${TARGET_ENV})" >> "$GITHUB_STEP_SUMMARY"
          aws cloudformation describe-stack-events \
            --stack-name "${STACK_NAME}" \
            --query "StackEvents[?contains(ResourceStatus, 'FAILED') || contains(ResourceStatus, 'ROLLBACK')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table | tee /tmp/cfn-events-prod.txt
          cat /tmp/cfn-events-prod.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Build Lambda package
        run: ./backend/scripts/build-lambda-package.sh

      - name: Deploy Lambda artifacts (prod)
        run: |
          ZIP_PATH="backend/.artifacts/artizans-backend-lambda.zip"
          OUTPUT_KEYS=(
            PublicApiFunctionName
            UserApiFunctionName
            ArtistApiFunctionName
            MessagingApiFunctionName
            AdminApiFunctionName
            PaymentsApiFunctionName
            WebhookApiFunctionName
          )

          echo "### Backend Lambda deploy (${TARGET_ENV})" >> "$GITHUB_STEP_SUMMARY"
          for key in "${OUTPUT_KEYS[@]}"; do
            function_name=$(aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query "Stacks[0].Outputs[?OutputKey=='${key}'].OutputValue | [0]" \
              --output text)

            if [ -z "${function_name}" ] || [ "${function_name}" = "None" ]; then
              echo "Missing CloudFormation output: ${key}" >&2
              exit 1
            fi

            version=$(aws lambda update-function-code \
              --function-name "${function_name}" \
              --zip-file "fileb://${ZIP_PATH}" \
              --publish \
              --query "Version" \
              --output text)

            aws lambda wait function-updated --function-name "${function_name}"
            echo "- ${function_name}: version ${version}" >> "$GITHUB_STEP_SUMMARY"
          done
