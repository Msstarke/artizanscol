<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to Account Settings</title>
    <meta http-equiv="refresh" content="0; url=/account-settings.html" />
    <script>
      const next = new URLSearchParams(window.location.search).get("next");
      window.location.replace(next ? `/account-settings.html?next=${encodeURIComponent(next)}` : "/account-settings.html");
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/account-settings.html">Account Settings</a>...</p>
  </body>
</html>
