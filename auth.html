    <title>Redirecting to Workspace</title>
    <meta http-equiv="refresh" content="0; url=/account-settings.html" />

      const next = new URLSearchParams(window.location.search).get("next");

    </script>
  </head>

    <p>Redirecting to <a href="/account-settings.html">Workspace</a>...</p>
