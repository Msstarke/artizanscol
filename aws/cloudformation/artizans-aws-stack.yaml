  ArtizansApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: CreateApiWaf
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-api-web-acl'
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}-${EnvironmentName}-api-web-acl'
        SampledRequestsEnabled: true
      Rules:
        - Name: AwsManagedRulesCommonRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${ProjectName}-${EnvironmentName}-api-common-rules'
            SampledRequestsEnabled: true
        - Name: AwsManagedRulesKnownBadInputsRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${ProjectName}-${EnvironmentName}-api-bad-input-rules'
            SampledRequestsEnabled: true
        - Name: ApiRateLimitPerIp
          Priority: 2
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 1200
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${ProjectName}-${EnvironmentName}-api-rate-limit'
            SampledRequestsEnabled: true

  ArtizansApiWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: CreateApiWaf
    Properties:
      ResourceArn: !Sub 'arn:aws:apigateway:${AWS::Region}::/apis/${ArtizansHttpApi}/stages/${ArtizansHttpApiStage}'
      WebACLArn: !GetAtt ArtizansApiWebAcl.Arn

  ArtizansHttpApiJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      AuthorizerType: JWT
      Name: !Sub '${ProjectName}-${EnvironmentName}-cognito-jwt'
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Ref ArtizansUserPoolClient
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${ArtizansUserPool}'

  ArtizansPublicApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ArtizansPublicApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000

  ArtizansUserApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ArtizansUserApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000

  ArtizansArtistApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ArtizansArtistApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000

  ArtizansMessagingApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ArtizansMessagingApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000

  ArtizansAdminApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ArtizansAdminApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000

  ArtizansPaymentsApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ArtizansPaymentsApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000

  ArtizansWebhookApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ArtizansWebhookApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000

  ArtizansRouteCategories:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'GET /v1/categories'
      Target: !Sub 'integrations/${ArtizansPublicApiIntegration}'

  ArtizansRouteArtists:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'GET /v1/artists'
      Target: !Sub 'integrations/${ArtizansPublicApiIntegration}'

  ArtizansRouteArtistById:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'GET /v1/artists/{artistId}'
      Target: !Sub 'integrations/${ArtizansPublicApiIntegration}'

  ArtizansRouteUserMe:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'ANY /v1/me'
      AuthorizationType: JWT
      AuthorizerId: !Ref ArtizansHttpApiJwtAuthorizer
      Target: !Sub 'integrations/${ArtizansUserApiIntegration}'

  ArtizansRouteUserMeProxy:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'ANY /v1/me/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref ArtizansHttpApiJwtAuthorizer
      Target: !Sub 'integrations/${ArtizansUserApiIntegration}'

  ArtizansRouteBookings:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'POST /v1/bookings'
      AuthorizationType: JWT
      AuthorizerId: !Ref ArtizansHttpApiJwtAuthorizer
      Target: !Sub 'integrations/${ArtizansUserApiIntegration}'

  ArtizansRouteBookingStatus:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'POST /v1/bookings/{bookingId}/status'
      AuthorizationType: JWT
      AuthorizerId: !Ref ArtizansHttpApiJwtAuthorizer
      Target: !Sub 'integrations/${ArtizansUserApiIntegration}'

  ArtizansRouteArtistApi:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'ANY /v1/artist/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref ArtizansHttpApiJwtAuthorizer
      Target: !Sub 'integrations/${ArtizansArtistApiIntegration}'

  ArtizansRouteThreads:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'GET /v1/threads'
      AuthorizationType: JWT
      AuthorizerId: !Ref ArtizansHttpApiJwtAuthorizer
      Target: !Sub 'integrations/${ArtizansMessagingApiIntegration}'

  ArtizansRouteThreadMessagesRead:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'GET /v1/threads/{threadId}/messages'
      AuthorizationType: JWT
      AuthorizerId: !Ref ArtizansHttpApiJwtAuthorizer
      Target: !Sub 'integrations/${ArtizansMessagingApiIntegration}'

  ArtizansRouteThreadMessagesWrite:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'POST /v1/threads/{threadId}/messages'
      AuthorizationType: JWT
      AuthorizerId: !Ref ArtizansHttpApiJwtAuthorizer
      Target: !Sub 'integrations/${ArtizansMessagingApiIntegration}'

  ArtizansRouteUpdates:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'GET /v1/me/updates'
      AuthorizationType: JWT
      AuthorizerId: !Ref ArtizansHttpApiJwtAuthorizer
      Target: !Sub 'integrations/${ArtizansMessagingApiIntegration}'

  ArtizansRouteAdminApi:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'ANY /v1/admin/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref ArtizansHttpApiJwtAuthorizer
      Target: !Sub 'integrations/${ArtizansAdminApiIntegration}'

  ArtizansRoutePaymentsCheckout:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'POST /v1/payments/checkout-session'
      AuthorizationType: JWT
      AuthorizerId: !Ref ArtizansHttpApiJwtAuthorizer
      Target: !Sub 'integrations/${ArtizansPaymentsApiIntegration}'

  ArtizansRoutePaymentsRefund:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'POST /v1/payments/refunds'
      AuthorizationType: JWT
      AuthorizerId: !Ref ArtizansHttpApiJwtAuthorizer
      Target: !Sub 'integrations/${ArtizansPaymentsApiIntegration}'

  ArtizansRouteStripeWebhook:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseServerlessApi
    Properties:
      ApiId: !Ref ArtizansHttpApi
      RouteKey: 'POST /v1/webhooks/stripe'
      Target: !Sub 'integrations/${ArtizansWebhookApiIntegration}'

  ArtizansPublicApiInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseServerlessApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ArtizansPublicApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ArtizansHttpApi}/*/*/*'

  ArtizansUserApiInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseServerlessApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ArtizansUserApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ArtizansHttpApi}/*/*/*'

  ArtizansArtistApiInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseServerlessApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ArtizansArtistApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ArtizansHttpApi}/*/*/*'

  ArtizansMessagingApiInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseServerlessApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ArtizansMessagingApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ArtizansHttpApi}/*/*/*'

  ArtizansAdminApiInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseServerlessApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ArtizansAdminApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ArtizansHttpApi}/*/*/*'

  ArtizansPaymentsApiInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseServerlessApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ArtizansPaymentsApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ArtizansHttpApi}/*/*/*'

  ArtizansWebhookApiInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseServerlessApi
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ArtizansWebhookApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ArtizansHttpApi}/*/*/*'

  ArtizansHttpApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: EnableApiCustomDomain
    Properties:
      DomainName: !Ref ApiDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ArtizansHttpApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: EnableApiCustomDomain
    Properties:
      ApiId: !Ref ArtizansHttpApi
      DomainName: !Ref ArtizansHttpApiDomain
      Stage: !Ref ArtizansHttpApiStage

  ArtizansHttpApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateApiDnsRecord
    Properties:
      HostedZoneId: !Ref ApiHostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ArtizansHttpApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt ArtizansHttpApiDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

  ArtizansApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UseServerlessApi
    Properties:
      AlarmName: !Sub '${ProjectName}-${EnvironmentName}-api-5xx'
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref ArtizansHttpApi
        - Name: Stage
          Value: '$default'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ArtizansPublicApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UseServerlessApi
    Properties:
      AlarmName: !Sub '${ProjectName}-${EnvironmentName}-public-api-errors'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ArtizansPublicApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ArtizansUserApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UseServerlessApi
    Properties:
      AlarmName: !Sub '${ProjectName}-${EnvironmentName}-user-api-errors'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ArtizansUserApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ArtizansArtistApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UseServerlessApi
    Properties:
      AlarmName: !Sub '${ProjectName}-${EnvironmentName}-artist-api-errors'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ArtizansArtistApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ArtizansMessagingApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UseServerlessApi
    Properties:
      AlarmName: !Sub '${ProjectName}-${EnvironmentName}-messaging-api-errors'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ArtizansMessagingApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ArtizansAdminApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UseServerlessApi
    Properties:
      AlarmName: !Sub '${ProjectName}-${EnvironmentName}-admin-api-errors'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ArtizansAdminApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ArtizansPaymentsApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UseServerlessApi
    Properties:
      AlarmName: !Sub '${ProjectName}-${EnvironmentName}-payments-api-errors'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ArtizansPaymentsApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ArtizansWebhookApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UseServerlessApi
    Properties:
      AlarmName: !Sub '${ProjectName}-${EnvironmentName}-webhook-api-errors'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ArtizansWebhookApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ArtizansEventsQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: UseServerlessApi
    Properties:
      AlarmName: !Sub '${ProjectName}-${EnvironmentName}-events-queue-depth'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ArtizansEventsQueue.QueueName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 100
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ArtizansEc2Role:
    Type: AWS::IAM::Role
    Condition: UseEc2Api
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  ArtizansEc2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: UseEc2Api
    Properties:
      Roles:
        - !Ref ArtizansEc2Role

  ArtizansEc2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseEc2Api
    Properties:
      GroupDescription: !Sub '${ProjectName} EC2 API security group'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ArtizansEc2ApiInstance:
    Type: AWS::EC2::Instance
    Condition: UseEc2Api
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      IamInstanceProfile: !Ref ArtizansEc2InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref ArtizansEc2SecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-api'

  ArtizansPrivateCertificateAuthority:
    Type: AWS::ACMPCA::CertificateAuthority
    Condition: UsePrivateCA
    Properties:
      Type: ROOT
      KeyAlgorithm: RSA_2048
      SigningAlgorithm: SHA256WITHRSA
      Subject:
        Country: AU
        Organization: Artizans
        OrganizationalUnit: Platform
        State: NSW
        CommonName: !Sub '${ProjectName}-${EnvironmentName}-private-ca'

