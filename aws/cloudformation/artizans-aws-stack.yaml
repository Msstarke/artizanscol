    Value: !Sub 'https://${ApiDomainName}'
  EventsQueueUrl:
    Condition: UseServerlessApi
    Value: !Ref ArtizansEventsQueue
  StripeSecretArn:
    Condition: UseServerlessApi
    Value: !Ref ArtizansStripeSecret
  StripeWebhookSecretArn:
    Condition: UseServerlessApi
    Value: !Ref ArtizansStripeWebhookSecret
  AppSecretArn:
    Condition: UseServerlessApi
    Value: !Ref ArtizansAppSecret

  UsersTableName:
