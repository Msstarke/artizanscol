  ServicesTableName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansServicesTable
  BookingsTableName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansBookingsTable
  MessagesTableName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansMessagesTable
  NotificationsTableName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansNotificationsTable
  ReportsTableName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansReportsTable
  CategoriesTableName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansCategoriesTable
  InvoicesTableName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansInvoicesTable
  PayoutsTableName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansPayoutsTable
  SystemConfigTableName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansSystemConfigTable
  RoleAssignmentsTableName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansRoleAssignmentsTable

  PublicApiFunctionName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansPublicApiFunction
  UserApiFunctionName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansUserApiFunction
  ArtistApiFunctionName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansArtistApiFunction
  MessagingApiFunctionName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansMessagingApiFunction
  AdminApiFunctionName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansAdminApiFunction
  PaymentsApiFunctionName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansPaymentsApiFunction
  WebhookApiFunctionName:
    Condition: UseServerlessApi
    Value: !Ref ArtizansWebhookApiFunction

