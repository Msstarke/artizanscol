  ArtizansApiLambdaRole:
    Type: AWS::IAM::Role
    Condition: UseServerlessApi
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${EnvironmentName}-api-runtime-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt ArtizansUsersTable.Arn
                  - !Sub '${ArtizansUsersTable.Arn}/index/*'
                  - !GetAtt ArtizansArtistsTable.Arn
                  - !Sub '${ArtizansArtistsTable.Arn}/index/*'
                  - !GetAtt ArtizansServicesTable.Arn
                  - !Sub '${ArtizansServicesTable.Arn}/index/*'
                  - !GetAtt ArtizansBookingsTable.Arn
                  - !Sub '${ArtizansBookingsTable.Arn}/index/*'
                  - !GetAtt ArtizansMessagesTable.Arn
                  - !Sub '${ArtizansMessagesTable.Arn}/index/*'
                  - !GetAtt ArtizansNotificationsTable.Arn
                  - !Sub '${ArtizansNotificationsTable.Arn}/index/*'
                  - !GetAtt ArtizansReportsTable.Arn
                  - !Sub '${ArtizansReportsTable.Arn}/index/*'
                  - !GetAtt ArtizansCategoriesTable.Arn
                  - !Sub '${ArtizansCategoriesTable.Arn}/index/*'
                  - !GetAtt ArtizansInvoicesTable.Arn
                  - !Sub '${ArtizansInvoicesTable.Arn}/index/*'
                  - !GetAtt ArtizansPayoutsTable.Arn
                  - !Sub '${ArtizansPayoutsTable.Arn}/index/*'
                  - !GetAtt ArtizansSystemConfigTable.Arn
                  - !GetAtt ArtizansRoleAssignmentsTable.Arn
                  - !Sub '${ArtizansRoleAssignmentsTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt ArtizansEventsQueue.Arn
                  - !GetAtt ArtizansEventsQueueDlq.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref ArtizansStripeSecret
                  - !Ref ArtizansStripeWebhookSecret
                  - !Ref ArtizansAppSecret

