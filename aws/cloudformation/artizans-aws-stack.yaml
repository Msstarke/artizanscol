AWSTemplateFormatVersion: '2010-09-09'
Description: Artizans AWS stack (S3 + CloudFront + WAF + Cognito + serverless API + optional EC2 + optional ACM PCA)

Parameters:
  ProjectName:
    Type: String
    Default: artizans
  EnvironmentName:
    Type: String
    Default: prod
  RegionHint:
    Type: String
    Default: ap-southeast-2

  DomainName:
    Type: String
    Default: ''
    Description: Optional custom domain (for CloudFront alias)
  RedirectFromDomainName:
    Type: String
    Default: ''
    Description: Optional secondary domain to 301 redirect to DomainName (for example bare -> www)
  HostedZoneId:
    Type: String
    Default: ''
    Description: Optional Route53 hosted zone ID for ACM DNS validation
  CertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate ARN (recommended for CloudFront)
  CreateManagedCertificate:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'

  EnablePrivateCA:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'

  EnableCloudFrontWaf:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  CloudFrontWebAclArn:
    Type: String
    Default: ''
    Description: Optional existing CloudFront-scope WAF Web ACL ARN (overrides template-created ACL when provided)
  EnableApiWaf:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'

  EnableEc2Api:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  VpcId:
    Type: String
    Default: ''
    Description: Required when EnableEc2Api=true
  SubnetId:
    Type: String
    Default: ''
    Description: Required when EnableEc2Api=true
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  EnableServerlessApi:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'

  ApiDomainName:
    Type: String
    Default: ''
    Description: Optional custom domain for the backend API (for example api.example.com)
  ApiCertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate ARN for the API custom domain (same region as API Gateway)
  ApiHostedZoneId:
    Type: String
    Default: ''
    Description: Optional Route53 hosted zone ID used to create API DNS alias

Conditions:
  HasDomainName: !Not [!Equals [!Ref DomainName, '']]
  HasRedirectFromDomainName: !Not [!Equals [!Ref RedirectFromDomainName, '']]
  HasHostedZoneId: !Not [!Equals [!Ref HostedZoneId, '']]
  HasProvidedCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  CreateManagedCertificateCondition: !And
    - !Equals [!Ref CreateManagedCertificate, 'true']
    - !Condition HasDomainName
    - !Condition HasHostedZoneId
  CanUseCustomDomain: !And
    - !Condition HasDomainName
    - !Or
      - !Condition HasProvidedCertificate
      - !Condition CreateManagedCertificateCondition
  EnableCanonicalDomainRedirect: !And
    - !Condition CanUseCustomDomain
    - !Condition HasRedirectFromDomainName
  UseEc2Api: !Equals [!Ref EnableEc2Api, 'true']
  UsePrivateCA: !Equals [!Ref EnablePrivateCA, 'true']
  IsUsEast1: !Equals [!Ref 'AWS::Region', 'us-east-1']
  HasCloudFrontWebAclArn: !Not [!Equals [!Ref CloudFrontWebAclArn, '']]
  CreateCloudFrontWaf: !And
    - !Equals [!Ref EnableCloudFrontWaf, 'true']
    - !Condition IsUsEast1
  UseServerlessApi: !Equals [!Ref EnableServerlessApi, 'true']
  CreateApiWaf: !And
    - !Condition UseServerlessApi
    - !Equals [!Ref EnableApiWaf, 'true']
  HasApiDomainName: !Not [!Equals [!Ref ApiDomainName, '']]
  HasApiCertificateArn: !Not [!Equals [!Ref ApiCertificateArn, '']]
  HasApiHostedZoneId: !Not [!Equals [!Ref ApiHostedZoneId, '']]
  EnableApiCustomDomain: !And
    - !Condition UseServerlessApi
    - !Condition HasApiDomainName
    - !Condition HasApiCertificateArn
  CreateApiDnsRecord: !And
    - !Condition EnableApiCustomDomain
    - !Condition HasApiHostedZoneId

Resources:
  ArtizansSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ArtizansOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub '${ProjectName}-${EnvironmentName} OAI'

  ArtizansBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtizansSiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              CanonicalUser: !GetAtt ArtizansOriginAccessIdentity.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub '${ArtizansSiteBucket.Arn}/*'

  ArtizansManagedCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateManagedCertificateCondition
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  ArtizansWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: CreateCloudFrontWaf
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-web-acl'
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}-${EnvironmentName}-web-acl'
        SampledRequestsEnabled: true
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${ProjectName}-${EnvironmentName}-common-rules'
            SampledRequestsEnabled: true
        - Name: RateLimitRule
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 2000
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${ProjectName}-${EnvironmentName}-rate-limit'
            SampledRequestsEnabled: true

  ArtizansResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-${EnvironmentName}-security-headers'
        Comment: Security response headers for static web delivery
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com https://*.execute-api.${AWS::Region}.amazonaws.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:;"
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: geolocation=(), microphone=(), camera=(), payment=()
              Override: true
        RemoveHeadersConfig:
          Items:
            - Header: server
            - Header: x-amz-version-id
            - Header: x-amz-id-2
            - Header: x-amz-request-id

  ArtizansCanonicalRedirectFunction:
    Type: AWS::CloudFront::Function
    Condition: EnableCanonicalDomainRedirect
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-canonical-redirect'
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect secondary host to canonical host
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = "";
          if (request.headers && request.headers.host && request.headers.host.value) {
            host = request.headers.host.value.toLowerCase();
          }
          var redirectFrom = "${RedirectFromDomainName}".toLowerCase();
          var canonicalHost = "${DomainName}".toLowerCase();
          if (host === redirectFrom) {
            return {
              statusCode: 301,
              statusDescription: "Moved Permanently",
              headers: {
                location: { value: "https://" + canonicalHost + request.uri },
                "cache-control": { value: "max-age=3600" }
              }
            };
          }
          return request;
        }

  ArtizansNoStoreCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${ProjectName}-${EnvironmentName}-no-store-cache'
        Comment: Disables caching for sensitive auth resources
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  ArtizansSensitiveNoStoreHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-${EnvironmentName}-security-headers-no-store'
        Comment: Security headers with no-store caching for auth-sensitive resources
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com https://*.execute-api.${AWS::Region}.amazonaws.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:;"
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: geolocation=(), microphone=(), camera=(), payment=()
              Override: true
            - Header: Cache-Control
              Value: no-store, no-cache, must-revalidate
              Override: true
            - Header: Pragma
              Value: no-cache
              Override: true
            - Header: Expires
              Value: 0
              Override: true
        RemoveHeadersConfig:
          Items:
            - Header: server
            - Header: x-amz-version-id
            - Header: x-amz-id-2
            - Header: x-amz-request-id

  ArtizansDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName}-${EnvironmentName} distribution'
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: artizans-site-origin
            DomainName: !GetAtt ArtizansSiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${ArtizansOriginAccessIdentity}'
          - !If
            - UseServerlessApi
            - Id: artizans-api-origin
              DomainName: !Select [2, !Split ["/", !GetAtt ArtizansHttpApi.ApiEndpoint]]
              CustomOriginConfig:
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
            - !Ref AWS::NoValue
        CacheBehaviors:
          - !If
            - UseServerlessApi
            - PathPattern: /v1/*
              TargetOriginId: artizans-api-origin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
              FunctionAssociations: !If
                - EnableCanonicalDomainRedirect
                - - EventType: viewer-request
                    FunctionARN: !GetAtt ArtizansCanonicalRedirectFunction.FunctionARN
                - !Ref AWS::NoValue
            - !Ref AWS::NoValue
          - PathPattern: /account-settings.html
            TargetOriginId: artizans-site-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref ArtizansNoStoreCachePolicy
            ResponseHeadersPolicyId: !Ref ArtizansSensitiveNoStoreHeadersPolicy
            FunctionAssociations: !If
              - EnableCanonicalDomainRedirect
              - - EventType: viewer-request
                  FunctionARN: !GetAtt ArtizansCanonicalRedirectFunction.FunctionARN
              - !Ref AWS::NoValue
          - PathPattern: /js/auth.js
            TargetOriginId: artizans-site-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref ArtizansNoStoreCachePolicy
            ResponseHeadersPolicyId: !Ref ArtizansSensitiveNoStoreHeadersPolicy
            FunctionAssociations: !If
              - EnableCanonicalDomainRedirect
              - - EventType: viewer-request
                  FunctionARN: !GetAtt ArtizansCanonicalRedirectFunction.FunctionARN
              - !Ref AWS::NoValue
          - PathPattern: /js/cognito-auth.js
            TargetOriginId: artizans-site-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref ArtizansNoStoreCachePolicy
            ResponseHeadersPolicyId: !Ref ArtizansSensitiveNoStoreHeadersPolicy
            FunctionAssociations: !If
              - EnableCanonicalDomainRedirect
              - - EventType: viewer-request
                  FunctionARN: !GetAtt ArtizansCanonicalRedirectFunction.FunctionARN
              - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: artizans-site-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          ResponseHeadersPolicyId: !Ref ArtizansResponseHeadersPolicy
          FunctionAssociations: !If
            - EnableCanonicalDomainRedirect
            - - EventType: viewer-request
                FunctionARN: !GetAtt ArtizansCanonicalRedirectFunction.FunctionARN
            - !Ref AWS::NoValue
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        Aliases: !If
          - CanUseCustomDomain
          - !If
            - HasRedirectFromDomainName
            - [!Ref DomainName, !Ref RedirectFromDomainName]
            - [!Ref DomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasProvidedCertificate
          -
            AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !If
            - CreateManagedCertificateCondition
            -
              AcmCertificateArn: !Ref ArtizansManagedCertificate
              SslSupportMethod: sni-only
              MinimumProtocolVersion: TLSv1.2_2021
            -
              CloudFrontDefaultCertificate: true
        WebACLId: !If
          - HasCloudFrontWebAclArn
          - !Ref CloudFrontWebAclArn
          - !If
            - CreateCloudFrontWaf
            - !GetAtt ArtizansWebAcl.Arn
            - !Ref AWS::NoValue

  ArtizansUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-${EnvironmentName}-users'
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  ArtizansUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-${EnvironmentName}-web-client'
      UserPoolId: !Ref ArtizansUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  ArtizansIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub '${ProjectName}_${EnvironmentName}_identity'
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref ArtizansUserPoolClient
          ProviderName: !Sub 'cognito-idp.${AWS::Region}.amazonaws.com/${ArtizansUserPool}'

  ArtizansCognitoAuthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-cognito-auth-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref ArtizansIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: !Sub '${ProjectName}-${EnvironmentName}-cognito-auth-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - mobileanalytics:PutEvents
                  - cognito-sync:*
                  - cognito-identity:*
                Resource: '*'

  ArtizansIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref ArtizansIdentityPool
      Roles:
        authenticated: !GetAtt ArtizansCognitoAuthRole.Arn

  ArtizansEventsQueueDlq:
    Type: AWS::SQS::Queue
    Condition: UseServerlessApi
    Properties:
      QueueName: !Sub '${ProjectName}-${EnvironmentName}-events-dlq'
      MessageRetentionPeriod: 1209600

  ArtizansEventsQueue:
    Type: AWS::SQS::Queue
    Condition: UseServerlessApi
    Properties:
      QueueName: !Sub '${ProjectName}-${EnvironmentName}-events'
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ArtizansEventsQueueDlq.Arn
        maxReceiveCount: 3

  ArtizansStripeSecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseServerlessApi
    Properties:
      Name: !Sub '${ProjectName}/${EnvironmentName}/stripe/secret-key'
      Description: Stripe secret key for backend payment operations
      GenerateSecretString:
        SecretStringTemplate: '{"provider":"stripe","key":""}'
        GenerateStringKey: placeholder
        PasswordLength: 32
        ExcludePunctuation: true

  ArtizansStripeWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseServerlessApi
    Properties:
      Name: !Sub '${ProjectName}/${EnvironmentName}/stripe/webhook-secret'
      Description: Stripe webhook signing secret
      GenerateSecretString:
        SecretStringTemplate: '{"provider":"stripe","webhookSecret":""}'
        GenerateStringKey: placeholder
        PasswordLength: 32
        ExcludePunctuation: true

  ArtizansAppSecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseServerlessApi
    Properties:
      Name: !Sub '${ProjectName}/${EnvironmentName}/app/secret'
      Description: Shared app secret used for server-side signed operations
      GenerateSecretString:
        SecretStringTemplate: '{"name":"artizans-app-secret"}'
        GenerateStringKey: secret
        PasswordLength: 64
        ExcludePunctuation: true

  ArtizansUsersTable:
    Type: AWS::DynamoDB::Table
    Condition: UseServerlessApi
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-users'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: cognitoSub
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CognitoSubIndex
          KeySchema:
            - AttributeName: cognitoSub
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ArtizansArtistsTable:
    Type: AWS::DynamoDB::Table
    Condition: UseServerlessApi
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-artists'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: category
          AttributeType: S
        - AttributeName: popularity
          AttributeType: N
        - AttributeName: location
          AttributeType: S
        - AttributeName: rating
          AttributeType: N
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ArtistsByCategoryPopularity
          KeySchema:
            - AttributeName: category
              KeyType: HASH
            - AttributeName: popularity
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ArtistsByLocationRating
          KeySchema:
            - AttributeName: location
              KeyType: HASH
            - AttributeName: rating
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ArtizansServicesTable:
    Type: AWS::DynamoDB::Table
    Condition: UseServerlessApi
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-services'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: artistId
          AttributeType: S
        - AttributeName: updatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ServicesByArtistUpdatedAt
          KeySchema:
            - AttributeName: artistId
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ArtizansBookingsTable:
    Type: AWS::DynamoDB::Table
    Condition: UseServerlessApi
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-bookings'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: artistId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: updatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: BookingsByUserCreatedAt
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: BookingsByArtistCreatedAt
          KeySchema:
            - AttributeName: artistId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: BookingsByStatusUpdatedAt
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ArtizansMessagesTable:
    Type: AWS::DynamoDB::Table
    Condition: UseServerlessApi
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-messages'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: threadId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: MessagesByThreadCreatedAt
          KeySchema:
            - AttributeName: threadId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ArtizansNotificationsTable:
    Type: AWS::DynamoDB::Table
    Condition: UseServerlessApi
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-notifications'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: ownerReadKey
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: NotificationsByOwnerRead
          KeySchema:
            - AttributeName: ownerReadKey
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ArtizansReportsTable:
    Type: AWS::DynamoDB::Table
    Condition: UseServerlessApi
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-reports'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: type
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ReportsByStatusType
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: type
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

