    Value: !Ref ArtizansUserPoolClient
  CognitoIdentityPoolId:
    Value: !Ref ArtizansIdentityPool
  ApiBaseUrl:
    Condition: UseServerlessApi
    Value: !Sub 'https://${ArtizansHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  ApiJwtAuthorizerId:
    Condition: UseServerlessApi
    Value: !Ref ArtizansHttpApiJwtAuthorizer
  ApiWebAclArn:
    Condition: CreateApiWaf
    Value: !GetAtt ArtizansApiWebAcl.Arn
  ApiCustomDomainUrl:
