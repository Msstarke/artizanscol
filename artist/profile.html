<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artist | Profile Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/components.css" />
  </head>
  <body>
    <div class="noise-overlay" aria-hidden="true"></div>
    <header class="site-header"><div class="container header-inner"><a class="brand" href="/index.html">ARTIZANS.COLLECTIVE</a><nav class="main-nav"><a href="/index.html">Home</a><a href="/explore.html">Explore</a><a href="/artist/bookings.html">Artist</a><a href="/account-settings.html" data-auth-link>Account Settings</a></nav><div class="header-actions"><span class="role-chip" data-role-chip>Role: artist</span><button class="btn btn-outline btn-small" data-logout>Logout</button></div></div></header>

    <main class="container page-shell app-layout">
      <aside class="side-nav"><h3>Artist Account</h3><ul><li><a href="/artist/onboarding.html">Onboarding</a></li><li><a href="/artist/profile.html">Profile management</a></li><li><a href="/artist/bookings.html">Booking management</a></li><li><a href="/artist/communication.html">Communication</a></li><li><a href="/artist/earnings.html">Earnings</a></li><li><a href="/artist/analytics.html">Analytics</a></li></ul></aside>
      <section class="dashboard-main split-grid">
        <article class="site-card">
          <h1 class="section-title" style="font-size:1.35rem;">Edit profile</h1>
          <form id="artist-profile-form" class="form-grid">
            <label>Name<input id="artist-name" type="text" required /></label>
            <label>Location<input id="artist-location" type="text" required /></label>
            <label>Bio<textarea id="artist-bio" required></textarea></label>
            <div class="form-actions"><button class="btn btn-primary" type="submit">Save profile</button></div>
          </form>
        </article>

        <article class="site-card">
          <h2 class="section-title" style="font-size:1.35rem;">Manage services</h2>
          <form id="service-form" class="form-grid">
            <label>Service title<input id="service-title" type="text" required /></label>
            <label>Description<textarea id="service-description" required></textarea></label>
            <div class="form-row"><label>Price<input id="service-price" type="number" min="1" required /></label><label>Delivery days<input id="service-days" type="number" min="1" required /></label></div>
            <div class="form-actions"><button class="btn btn-outline" type="submit">Add service</button></div>
          </form>
          <ul id="service-list" class="collection" style="margin-top:0.8rem;"></ul>
        </article>
      </section>
    </main>

    <footer class="site-footer"><div class="container footer-inner"><p>Artist profile management</p><p>Edit profile and manage services</p></div></footer>
    <script type="module" src="/js/artist/profile.js"></script>
  </body>
</html>
