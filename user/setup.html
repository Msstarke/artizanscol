<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User | Account Setup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/components.css" />
  </head>
  <body>
    <div class="noise-overlay" aria-hidden="true"></div>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/index.html">ARTIZANS.COLLECTIVE</a>
        <nav class="main-nav">
          <a href="/index.html">Home</a><a href="/explore.html">Explore</a><a href="/user/discovery.html">User</a><a href="/account-settings.html" data-auth-link>Account Settings</a>
        </nav>
        <div class="header-actions"><span class="role-chip" data-role-chip>Role: user</span><button class="btn btn-outline btn-small" data-logout>Logout</button></div>
      </div>
    </header>

    <main class="container page-shell app-layout">
      <aside class="side-nav">
        <h3>User Account</h3>
        <ul>
          <li><a href="/user/setup.html">Account setup</a></li>
          <li><a href="/user/discovery.html">Discovery</a></li>
          <li><a href="/user/interaction.html">Interaction</a></li>
          <li><a href="/user/account.html">Profile settings</a></li>
          <li><a href="/user/notifications.html">Notifications</a></li>
          <li><a href="/user/history.html">Booking history</a></li>
        </ul>
      </aside>

      <section class="dashboard-main">
        <article class="site-card">
          <p class="site-tag">Account setup</p>
          <h1 class="section-title">Email verification and profile completion</h1>
          <div id="setup-kpis" class="kpi-grid"></div>
          <form id="setup-form" class="form-grid" style="margin-top:1rem;">
            <label>Email<input id="setup-email" type="email" required /></label>
            <label>Display name<input id="setup-name" type="text" required /></label>
            <label>Location<input id="setup-location" type="text" required /></label>
            <div class="form-actions">
              <button class="btn btn-primary" type="submit">Save profile details</button>
              <button class="btn btn-outline" type="button" id="verify-email-btn">Mark email verified</button>
              <button class="btn btn-ghost" type="button" id="complete-profile-btn">Mark profile complete</button>
            </div>
          </form>
        </article>
      </section>
    </main>

    <footer class="site-footer"><div class="container footer-inner"><p>User setup</p><p>Email verification + completion</p></div></footer>
    <script type="module" src="/js/user/setup.js"></script>
  </body>
</html>
